# ⚠️ Only non-root builds.

parallel-jobs = 1

[YT] # Default patches are applied, Except line 7 and 8 :
rv-brand = "Morphe"
excluded-patches = "'Swipe controls'"
patcher-args = "-e 'Custom branding' -OcustomName=YouTube -OcustomIcon='.github/logos/morphe_play/'"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
# archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.youtube"

[YT-Revancify-blue] # Same patches applied as before, but with Extended icon:
rv-brand = "Morphe"
excluded-patches = "'Swipe controls'"
patcher-args = "-e 'Custom branding' -OcustomName=YouTube -OcustomIcon='.github/logos/revancify_blue/'"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
# archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.youtube"

# [Music] is no longer available :
# use [Metrolist](https://github.com/MetrolistGroup/Metrolist/releases/latest),
# or [ArchiveTune](https://github.com/rukamori/archivetune/releases/latest) instead.

[TikTok]
rv-brand = "Hushfeed"
patches-source = "SysAdminDoc/hushfeed"
