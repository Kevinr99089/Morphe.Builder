name: Sync Fork

on:
  schedule:
    - cron: '0 * 31 2 *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/sync.yml']

permissions:
  contents: write

concurrency:
  group: sync-fork
  cancel-in-progress: false

env:
  UPSTREAM_REPO: j-hc/revanced-magisk-module
  TARGET_BRANCH: main
  PATCHES_SRC: MorpheApp/morphe-patches
  CLI_SRC: MorpheApp/morphe-cli
  BRAND: Morphe
  CI_CRON: '0 * 31 2 *'
  SYNC_FILES: 'build.sh utils.sh .github/workflows/build.yml .github/workflows/ci.yml'
  SYNC_EXTRA: 'ks.keystore ks-p12.keystore sig.txt LICENSE .gitignore'
  SYNC_DIRS: 'bin'
  WATCH_FILES: ''
  KEEPALIVE_DAYS: '45'
  TRACK_UPSTREAM: 'true'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check sync token
        env:
          SYNC_AUTH: ${{ secrets.SYNC_AUTH }}
        run: |
          if [ -z "$SYNC_AUTH" ]; then
            echo "::error::Secret SYNC_AUTH is missing or empty. Create a personal access token with the 'repo' and 'workflow' scopes and save it as a repository secret named SYNC_AUTH."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_AUTH }}

      - name: Sync, patch and validate
        id: sync
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import re
          import subprocess
          import sys
          import time

          E = os.environ.get
          UPSTREAM_REPO = E("UPSTREAM_REPO") or "j-hc/revanced-magisk-module"
          UPSTREAM_URL = E("UPSTREAM_URL") or f"https://github.com/{UPSTREAM_REPO}.git"
          PATCHES_SRC = E("PATCHES_SRC") or "MorpheApp/morphe-patches"
          CLI_SRC = E("CLI_SRC") or "MorpheApp/morphe-cli"
          BRAND = E("BRAND") or "Morphe"
          CI_CRON = E("CI_CRON") or "0 * 31 2 *"
          SYNC_FILES = E("SYNC_FILES", "build.sh utils.sh .github/workflows/build.yml .github/workflows/ci.yml").split()
          SYNC_EXTRA = E("SYNC_EXTRA", "ks.keystore ks-p12.keystore sig.txt LICENSE .gitignore").split()
          SYNC_DIRS = E("SYNC_DIRS", "bin").split()
          WATCH_FILES = E("WATCH_FILES", "config.toml CONFIG.md").split()
          TOKEN_EXPR = "$" "{{ secrets.GITHUB_TOKEN }}"
          BUILD_YML = ".github/workflows/build.yml"
          CI_YML = ".github/workflows/ci.yml"


          def sh(*cmd, check=True):
              r = subprocess.run(cmd, text=True, capture_output=True, stdin=subprocess.DEVNULL)
              if check and r.returncode != 0:
                  raise RuntimeError(f"`{' '.join(cmd)}` failed ({r.returncode}): {(r.stderr or r.stdout).strip()}")
              return r


          def git(*args, check=True):
              return sh("git", *args, check=check).stdout.strip()


          def read(path):
              with open(path, newline="") as f:
                  return f.read()


          def write(path, text):
              with open(path, "w", newline="") as f:
                  f.write(text)


          def short(sha):
              return sha[:7] if sha else "none"


          def fetch_upstream():
              if sh("git", "remote", "get-url", "upstream", check=False).returncode == 0:
                  git("remote", "set-url", "upstream", UPSTREAM_URL)
              else:
                  git("remote", "add", "upstream", UPSTREAM_URL)
              m = re.search(r"ref: refs/heads/(\S+)\s+HEAD", sh("git", "ls-remote", "--symref", "upstream", "HEAD", check=False).stdout)
              branch = m.group(1) if m else "main"
              for attempt in range(1, 4):
                  try:
                      git("fetch", "--no-tags", "upstream", f"+refs/heads/{branch}:refs/remotes/upstream/{branch}")
                      return branch
                  except RuntimeError:
                      if attempt == 3:
                          raise
                      time.sleep(5 * attempt)


          def last_synced_commit():
              for body in git("log", "--first-parent", "-n", "200", "--format=%B%x00").split("\x00"):
                  m = re.search(r"^Upstream-Commit: ([0-9a-f]{40})\s*$", body, re.M)
                  if m:
                      sha = m.group(1)
                      if sh("git", "cat-file", "-e", f"{sha}^{{commit}}", check=False).returncode == 0:
                          return sha
              return None


          SOURCE_RE = re.compile(r"""^[ \t]*(?:source|\.)[ \t]+["']?(?:\./)?([A-Za-z0-9_][A-Za-z0-9_./-]*\.sh)["']?""", re.M)


          def collect_files(ref, tree, problems, warnings):
              files = []
              for f in SYNC_FILES:
                  if f in tree:
                      files.append(f)
                  else:
                      problems.append(f"`{f}` no longer exists upstream (renamed or removed). The sync rules must be updated.")
              for f in SYNC_EXTRA:
                  if f in tree:
                      files.append(f)
                  else:
                      warnings.append(f"`{f}` no longer exists upstream, your copy was left untouched.")
              for d in SYNC_DIRS:
                  if any(p.startswith(d + "/") for p in tree):
                      files.append(d)
                  else:
                      problems.append(f"Directory `{d}` no longer exists upstream (moved or renamed). The sync rules must be updated.")
              followed = []
              queue = [f for f in files if f.endswith(".sh")]
              while queue:
                  current = queue.pop()
                  for m in SOURCE_RE.finditer(sh("git", "show", f"{ref}:{current}").stdout):
                      path = m.group(1)
                      if path in tree and path not in files:
                          files.append(path)
                          followed.append(path)
                          if path.endswith(".sh"):
                              queue.append(path)
              return files, followed


          def mirror_dirs(tree, files):
              removed = []
              for d in SYNC_DIRS:
                  if d not in files:
                      continue
                  keep = {p for p in tree if p.startswith(d + "/")}
                  local = [p for p in sh("git", "ls-files", "-z", "--", d).stdout.split("\0") if p]
                  stale = [p for p in local if p not in keep]
                  if stale:
                      git("rm", "-q", "--", *stale)
                      removed += stale
              return removed


          def set_default(var, value):
              pattern = re.compile(r"(\|\|\s*" + re.escape(var) + r'=)"[^"\n]*"')

              def fn(text):
                  new, n = pattern.subn(lambda m: m.group(1) + '"' + value + '"', text)
                  return (new, f"{var}={value}") if n else None

              return fn


          CMPR_LINES = re.compile(r"^(?=[^\n]*MODULE_TEMPLATE_DIR)(?=[^\n]*(?:cmpr|mkdir -p))[^\n]*\n", re.M)


          def drop_module_downloads(text):
              new, n = CMPR_LINES.subn("", text)
              return (new, f"{n} line(s) removed") if n else None


          PROMO_LINES = re.compile(r'^[ \t]*log "[^\n]*(?:MicroG-RE|zygisk-detach|revanced-magisk-module)[^\n]*"[ \t]*\n', re.M)
          CHANGELOG_ANCHOR = re.compile(r'^[ \t]*log "\$\(cat "\$TEMP_DIR"/\*/changelog\.md\)"[ \t]*\n', re.M)
          NOTES_SNIPPET = r'''log "For YT Music, you can use [ArchiveTune](https://github.com/rukamori/ArchiveTune)."

          _notes_hdr=()
          if [ -n "${GITHUB_TOKEN-}" ]; then _notes_hdr=(-H "Authorization: Bearer ${GITHUB_TOKEN}"); fi
          case "$DEF_PATCHES_VER" in
              latest) _notes_ep="releases/latest" ;;
              dev) _notes_ep="releases?per_page=1" ;;
              *) _notes_ep="releases/tags/${DEF_PATCHES_VER}" ;;
          esac
          UPSTREAM_NOTES=$(curl -fsS --max-time 30 ${_notes_hdr[@]+"${_notes_hdr[@]}"} "https://api.github.com/repos/${DEF_PATCHES_SRC}/${_notes_ep}" 2>/dev/null | jq -r '(if type == "array" then .[0] else . end) | .body // empty' 2>/dev/null | tr -d '\r') || UPSTREAM_NOTES=""
          if [ -n "$UPSTREAM_NOTES" ]; then
              printf '\n%s\n' "$UPSTREAM_NOTES" >>"build.md"
          else
              log "\n*No release notes found on the upstream repository.*"
          fi
          '''


          def changelog(text):
              if not CHANGELOG_ANCHOR.search(text):
                  return None
              text = PROMO_LINES.sub("", text)
              m = CHANGELOG_ANCHOR.search(text)
              return text[: m.end()] + NOTES_SNIPPET + text[m.end():], "promo lines replaced by patches release notes"


          MODE_LINE = re.compile(r"^([ \t]*)local mode_arg=[^\n]*\n", re.M)


          def force_apk_mode(text):
              m = MODE_LINE.search(text)
              if not m:
                  return None
              return text[: m.end()] + f"{m.group(1)}mode_arg=apk\n" + text[m.end():], "mode_arg forced to apk"


          UPDATE_COND = re.compile(r"^([ \t]*)if (!\s*)?git checkout origin/update build\.md; then[ \t]*$", re.M)


          def use_release_body(text):
              def rep(m):
                  ind = m.group(1)
                  neg = "! " if m.group(2) else ""
                  return (
                      f'{ind}export GITHUB_TOKEN="{TOKEN_EXPR}"\n'
                      f'{ind}gh release view -R "$GITHUB_REPOSITORY" --json body -q .body >build.md 2>/dev/null || : >build.md\n'
                      f"{ind}if {neg}[ -s build.md ]; then"
                  )

              new, n = UPDATE_COND.subn(rep, text)
              return (new, f"{n} occurrence(s)") if n else None


          def set_cron(text):
              new, n = re.subn(r"""(cron:\s*)(["'])[^"'\n]*\2""", lambda m: m.group(1) + '"' + CI_CRON + '"', text)
              return (new, f"cron={CI_CRON}") if n else None


          RELEASE_TITLE = re.compile(r'--title "Release"')


          def release_title(text):
              new, n = RELEASE_TITLE.subn(f'--title "{BRAND}"', text)
              return (new, f'title="{BRAND}"') if n else None


          def relabel(text):
              if "Build modules/APKs" not in text:
                  return None
              return text.replace("Build modules/APKs", "Build " + BRAND), "label renamed"


          def step_ranges(lines):
              ranges = []
              i = 0
              while i < len(lines):
                  m = re.match(r"^(\s*)steps:\s*$", lines[i])
                  if not m:
                      i += 1
                      continue
                  base = len(m.group(1))
                  j = i + 1
                  while j < len(lines) and not lines[j].strip():
                      j += 1
                  if j >= len(lines):
                      break
                  dash = len(lines[j]) - len(lines[j].lstrip())
                  if dash <= base or not lines[j].lstrip().startswith("- "):
                      i += 1
                      continue
                  starts = []
                  k = j
                  while k < len(lines):
                      line = lines[k]
                      if line.strip():
                          indent = len(line) - len(line.lstrip())
                          if indent < dash:
                              break
                          if indent == dash and line.lstrip().startswith("- "):
                              starts.append(k)
                      k += 1
                  for a, s in enumerate(starts):
                      ranges.append((s, starts[a + 1] if a + 1 < len(starts) else k))
                  i = k
              return ranges


          DROP_NAME = re.compile(r"^\s*(?:-\s*)?name:.*(?:Update modules changelog|Commit module json|Report to Telegram)", re.M | re.I)
          DROP_BODY = re.compile(r"HEAD:update|checkout -f update|--orphan update|/update/build\.md|api\.telegram\.org|\bTG_TOKEN\b")


          def drop_unused_steps(text):
              lines = text.split("\n")
              doomed = [(s, e) for s, e in step_ranges(lines) if DROP_NAME.search("\n".join(lines[s:e])) or DROP_BODY.search("\n".join(lines[s:e]))]
              if not doomed:
                  return text, "nothing to remove"
              names = []
              for s, e in reversed(doomed):
                  m = re.search(r"name:\s*(.+)", "\n".join(lines[s:e]))
                  names.append(m.group(1).strip() if m else "unnamed step")
                  del lines[s:e]
              new = "\n".join(lines).rstrip("\n") + "\n"
              return new, "removed: " + ", ".join(reversed(names))


          CONFIG_ASSET_OLD = """'.assets[] | select(.name | (endswith("asc") or endswith("json")) | not) | .name'"""
          CONFIG_ASSET_NEW = """'first(.assets[] | select(.name | (endswith("asc") or endswith("json")) | not) | .name)'"""


          def config_update_first_asset(text):
              if CONFIG_ASSET_OLD not in text:
                  return None
              return text.replace(CONFIG_ASSET_OLD, CONFIG_ASSET_NEW), "first release asset used"


          APKM_SNIPPET = r'''_apkm_cffi_ready() {
              local ok="$TEMP_DIR/.cffi_ok" no="$TEMP_DIR/.cffi_no"
              if [ -f "$ok" ]; then return 0; fi
              if [ -f "$no" ]; then return 1; fi
              if command -v python3 >/dev/null 2>&1; then
                  python3 -c 'import curl_cffi' >/dev/null 2>&1 ||
                      python3 -m pip install -q --disable-pip-version-check --break-system-packages curl_cffi >/dev/null 2>&1 ||
                      python3 -m pip install -q --disable-pip-version-check curl_cffi >/dev/null 2>&1 || :
                  if python3 -c 'import curl_cffi' >/dev/null 2>&1; then
                      cat >"$TEMP_DIR/cffi_get.py" <<'CFFI_PY'
          import json
          import sys

          url, out, jar = sys.argv[1], sys.argv[2], sys.argv[3]
          try:
              from curl_cffi import requests
          except Exception as exc:
              sys.stderr.write("curl_cffi unavailable: %s\n" % exc)
              sys.exit(3)
          try:
              s = requests.Session(impersonate="chrome")
              try:
                  with open(jar) as f:
                      for k, v in json.load(f).items():
                          s.cookies.set(k, v, domain="www.apkmirror.com")
              except Exception:
                  pass
              r = s.get(url, headers={"Referer": "https://www.apkmirror.com/"}, timeout=600, allow_redirects=True, stream=True)
              code = r.status_code
              if code >= 400:
                  sys.stderr.write("HTTP %d\n" % code)
                  sys.exit(1 if code in (403, 408, 425, 429) or code >= 500 else 22)
              with open(out, "wb") as f:
                  for chunk in r.iter_content(chunk_size=1 << 20):
                      f.write(chunk)
              try:
                  with open(jar, "w") as f:
                      json.dump(s.cookies.get_dict(), f)
              except Exception:
                  pass
          except SystemExit:
              raise
          except (TypeError, AttributeError, NotImplementedError) as exc:
              sys.stderr.write("curl_cffi API error: %s\n" % exc)
              sys.exit(3)
          except Exception as exc:
              sys.stderr.write("%s\n" % exc)
              sys.exit(1)
          CFFI_PY
                      : >"$ok"
                      return 0
                  fi
              fi
              : >"$no"
              return 1
          }

          _apkm_blocked() {
              grep -qaiE '<title>(just a moment|attention required)' <(head -c 8192 "$1" 2>/dev/null)
          }

          _apkm_once() {
              local url="$1" out="$2" code="" rc=0
              if _apkm_cffi_ready; then
                  python3 "$TEMP_DIR/cffi_get.py" "$url" "$out" "$TEMP_DIR/cffi_cookies.json" && rc=0 || rc=$?
                  if [ "$rc" -ne 3 ]; then
                      if [ "$rc" -eq 0 ] && _apkm_blocked "$out"; then rc=1; fi
                      return "$rc"
                  fi
              fi
              code=$(command curl -L -s -S --compressed --http2 --connect-timeout 15 -m 900 \
                  -c "$TEMP_DIR/cookie.txt" -b "$TEMP_DIR/cookie.txt" \
                  -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36" \
                  -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8" \
                  -H "Accept-Language: en-US,en;q=0.9" \
                  -H "Referer: https://www.apkmirror.com/" \
                  -H "Upgrade-Insecure-Requests: 1" \
                  -H "Sec-Fetch-Dest: document" -H "Sec-Fetch-Mode: navigate" -H "Sec-Fetch-Site: same-origin" \
                  -o "$out" -w '%{http_code}' "$url") && rc=0 || rc=$?
              if [ "$rc" -ne 0 ]; then return 1; fi
              case "$code" in
              2??) if _apkm_blocked "$out"; then return 1; fi; return 0 ;;
              403 | 408 | 425 | 429 | 5??) return 1 ;;
              *) return 22 ;;
              esac
          }

          _apkm_fetch() {
              local url="$1" out="$2" tmpf try rc=0
              tmpf=$(mktemp "${TEMP_DIR}/apkm.XXXXXX") || return 1
              for try in 1 2 3; do
                  _apkm_once "$url" "$tmpf" && rc=0 || rc=$?
                  if [ "$rc" -eq 0 ]; then
                      if [ "$out" = - ]; then cat "$tmpf"; rm -f "$tmpf"; else mv -f "$tmpf" "$out"; fi
                      return 0
                  fi
                  if [ "$rc" -eq 22 ]; then break; fi
                  if [ "$try" -lt 3 ]; then
                      echo "[!] APKMirror blocked or unreachable (try $try/3), waiting before retry: $url" >&2
                      sleep $((try * 6 + RANDOM % 6))
                  fi
              done
              rm -f "$tmpf"
              return 22
          }

          curl() {
              local a url="" out="" prev=""
              for a in "$@"; do
                  if [ "$prev" = "-o" ]; then out="$a"; fi
                  case "$a" in
                  http://*apkmirror.com* | https://*apkmirror.com*) url="$a" ;;
                  esac
                  prev="$a"
              done
              if [ -z "$url" ] || [ -z "$out" ]; then
                  command curl "$@" && return 0 || return $?
              fi
              _apkm_fetch "$url" "$out"
          }
          '''


          def apkmirror_antibot(text):
              if "_apkm_fetch()" in text:
                  return text, "already present"
              if text and not text.endswith("\n"):
                  text += "\n"
              return text + "\n" + APKM_SNIPPET, "appended at the end of the file, no upstream line touched"


          PATCHES = [
              ("Default patches source", "build.sh", set_default("DEF_PATCHES_SRC", PATCHES_SRC), True),
              ("Default CLI source", "build.sh", set_default("DEF_CLI_SRC", CLI_SRC), True),
              ("Default brand", "build.sh", set_default("DEF_RV_BRAND", BRAND), True),
              ("Skip module-only downloads", "build.sh", drop_module_downloads, False),
              ("Changelog links and patches release notes", "build.sh", changelog, False),
              ("Force APK-only mode", "utils.sh", force_apk_mode, False),
              ("Config update: use first release asset", "utils.sh", config_update_first_asset, False),
              ("Anti-bot: browser-grade APKMirror requests", "utils.sh", apkmirror_antibot, False),
              ("CI: last build read from latest release", CI_YML, use_release_body, True),
              ("CI: schedule", CI_YML, set_cron, False),
              ("Build: last build read from latest release", BUILD_YML, use_release_body, False),
              ("Build: drop update-branch and Telegram steps", BUILD_YML, drop_unused_steps, False),
              ("Build: step label", BUILD_YML, relabel, False),
              ("Build: release title", BUILD_YML, release_title, False),
          ]


          def apply_patches(problems, warnings):
              results = []
              for label, path, fn, critical in PATCHES:
                  if not os.path.exists(path):
                      status, detail = "MISSING", "file not found"
                  else:
                      original = read(path)
                      out = fn(original)
                      if out is None:
                          status, detail = "MISSING", "pattern not found, upstream changed"
                      else:
                          new, detail = out
                          if new != original:
                              write(path, new)
                          status = "ok"
                  results.append((label, path, status, detail, critical))
                  if status == "MISSING":
                      (problems if critical else warnings).append(f"Patch '{label}' ({path}): {detail}.")
              return results


          UPDATE_BRANCH_REFS = re.compile(r"origin/update|HEAD:update|checkout -f update|--orphan update|/update/build\.md")


          def validate(files, problems, warnings):
              for f in [f for f in files if f.endswith(".sh")]:
                  r = sh("bash", "-n", f, check=False)
                  if r.returncode != 0:
                      problems.append(f"Shell syntax error in `{f}` after patching: {r.stderr.strip()}")

              workflows = [f for f in (CI_YML, BUILD_YML) if os.path.exists(f)]
              try:
                  import yaml
              except ImportError:
                  sh(sys.executable, "-m", "pip", "install", "--quiet", "--break-system-packages", "pyyaml", check=False)
                  try:
                      import yaml
                  except ImportError:
                      yaml = None
                      warnings.append("PyYAML not available: YAML syntax check skipped.")
              for f in workflows:
                  text = read(f)
                  if yaml is not None:
                      try:
                          data = yaml.safe_load(text)
                          if not isinstance(data, dict) or "jobs" not in data:
                              problems.append(f"`{f}` has no jobs after patching.")
                      except Exception as exc:
                          problems.append(f"`{f}` is not valid YAML after patching: {str(exc).splitlines()[0]}")
                  if UPDATE_BRANCH_REFS.search(text):
                      problems.append(f"`{f}` still refers to the `update` branch.")
                  ids = set(re.findall(r"^\s*(?:-\s*)?id:\s*([A-Za-z0-9_-]+)\s*$", text, re.M))
                  refs = set(re.findall(r"\bsteps\.([A-Za-z0-9_-]+)\.", text))
                  for missing in sorted(refs - ids):
                      problems.append(f"`{f}` uses the output of step `{missing}`, which no longer exists.")

              if os.path.exists(BUILD_YML) and "gh release create" not in read(BUILD_YML):
                  problems.append("`build.yml` no longer creates GitHub releases (`gh release create` not found).")

              if os.path.exists("build.sh"):
                  text = read("build.sh")
                  for label, value in (("patches source", PATCHES_SRC), ("CLI source", CLI_SRC), ("brand", BRAND)):
                      if f'"{value}"' not in text:
                          problems.append(f"`build.sh` does not use the expected {label} `{value}`.")

              for f in ("build.sh", "utils.sh"):
                  if os.path.exists(f):
                      for line in read(f).splitlines():
                          if re.search(r"ReVanced/revanced-(patches|cli)", line) and not line.lstrip().startswith("#"):
                              warnings.append(f"`{f}` still mentions an original ReVanced source: `{line.strip()[:100]}`")

              changed = set(git("diff", "--name-only", "HEAD").splitlines()) | set(git("ls-files", "--others", "--exclude-standard").splitlines())
              for path in sorted(changed):
                  if not any(path == f or path.startswith(f + "/") for f in files):
                      problems.append(f"Unexpected change outside the synced files: `{path}`.")

              if not problems:
                  check_apkmirror_hook(problems, warnings)


          HOOK_SCRIPT = r"""source ./utils.sh
          sleep() { :; }
          base="$1"
          out=$(req "$base/page?apkmirror.com" -) && echo "T1_RC=0" || echo "T1_RC=$?"
          printf 'T1_BODY=%s\n' "$out"
          req "$base/file?apkmirror.com" "$PWD/got.bin" && echo "T2_RC=0" || echo "T2_RC=$?"
          printf 'T2_BODY=%s\n' "$(cat got.bin 2>/dev/null)"
          req "$base/missing?apkmirror.com" - >/dev/null 2>&1 && echo "T3_RC=0" || echo "T3_RC=$?"
          """


          def check_apkmirror_hook(problems, warnings):
              import http.server
              import shutil
              import tempfile
              import threading

              text = read("utils.sh")
              hosts = sorted(set(re.findall(r"https?://([A-Za-z0-9.-]*apkmirror[A-Za-z0-9.-]*)", text)))
              odd = [h for h in hosts if not h.endswith("apkmirror.com")]
              if odd:
                  warnings.append("`utils.sh` now uses APKMirror host(s) the anti-bot layer does not intercept: " + ", ".join(odd) + ". The `curl` override in the sync rules must be widened.")

              seen = []

              class Handler(http.server.BaseHTTPRequestHandler):
                  def log_message(self, *args):
                      pass

                  def do_GET(self):
                      seen.append((self.path.split("?")[0], self.headers.get("User-Agent", ""), self.headers.get("Referer", "")))
                      code, body = (404, b"missing") if self.path.startswith("/missing") else (200, b"APKM-HOOK-OK")
                      self.send_response(code)
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)

              work = tempfile.mkdtemp(prefix="apkm-hook-")
              server = None
              try:
                  server = http.server.ThreadingHTTPServer(("127.0.0.1", 0), Handler)
                  threading.Thread(target=server.serve_forever, daemon=True).start()
                  shutil.copy("utils.sh", work)
                  os.makedirs(os.path.join(work, "temp"))
                  open(os.path.join(work, "temp", ".cffi_no"), "w").close()
                  env = {k: v for k, v in os.environ.items() if not k.startswith("GITHUB_")}
                  env["NO_PROXY"] = env["no_proxy"] = "127.0.0.1"
                  r = subprocess.run(["bash", "-c", HOOK_SCRIPT, "bash", f"http://127.0.0.1:{server.server_address[1]}"], cwd=work, env=env, text=True, capture_output=True, stdin=subprocess.DEVNULL, timeout=90)
              except Exception as exc:
                  warnings.append(f"APKMirror anti-bot self-test could not run: {exc}")
                  return
              finally:
                  if server is not None:
                      server.shutdown()
                  shutil.rmtree(work, ignore_errors=True)

              got = dict(re.findall(r"^(T\d_[A-Z]+)=(.*)$", r.stdout, re.M))
              if "T1_RC" not in got:
                  warnings.append("APKMirror anti-bot self-test could not source the patched `utils.sh`: " + (r.stderr.strip().splitlines() or ["no output"])[-1][:200])
                  return
              if got.get("T1_RC") == "127":
                  problems.append("`req` is no longer callable after sourcing the patched `utils.sh` (renamed or removed upstream?). The APKMirror self-test and the `curl` override in the sync rules must be adapted to the new request function.")
                  return
              reached = {path: (ua, ref) for path, ua, ref in seen}
              intercepted = all(p in reached and "Chrome/" in reached[p][0] and "apkmirror.com" in reached[p][1] for p in ("/page", "/file"))
              if not intercepted:
                  problems.append("The APKMirror anti-bot layer is no longer reached: upstream changed how `utils.sh` sends HTTP requests (`req`/`_req`), so the `curl` override is bypassed. The override in the sync rules must be adapted to the new request code.")
                  return
              if got.get("T1_RC") != "0" or got.get("T1_BODY") != "APKM-HOOK-OK" or got.get("T2_RC") != "0" or got.get("T2_BODY") != "APKM-HOOK-OK":
                  problems.append("The APKMirror anti-bot layer is reached but no longer returns the page or the file through `req` as upstream expects (stdout mode or file mode).")
              elif got.get("T3_RC") in (None, "0"):
                  problems.append("The APKMirror anti-bot layer no longer reports HTTP errors (404) to `req`, so upstream error handling would be skipped.")


          def upstream_changes(old, new, paths):
              if not old:
                  return None
              if old == new:
                  return "Upstream has not changed since the last sync."
              stat = git("diff", "--stat", old, new, "--", *paths, check=False)
              commits = git("log", "--oneline", "--no-merges", "-n", "25", f"{old}..{new}", "--", *paths, check=False)
              if not stat and not commits:
                  return "Upstream moved, but none of the synced or watched files changed."
              return f"Commits touching synced or watched files:\n{commits}\n\nFiles:\n{stat}"


          def main():
              problems, warnings, removed = [], [], []
              branch = fetch_upstream()
              ref = f"upstream/{branch}"
              new_sha = git("rev-parse", ref)
              old_sha = last_synced_commit()
              tree = set(git("ls-tree", "-r", "--name-only", ref).splitlines())

              files, followed = collect_files(ref, tree, problems, warnings)
              changes = upstream_changes(old_sha, new_sha, files + [w for w in WATCH_FILES if w in tree])
              watched_changed = []
              if old_sha and old_sha != new_sha:
                  for w in WATCH_FILES:
                      if w in tree and git("diff", "--name-only", old_sha, new_sha, "--", w, check=False):
                          watched_changed.append(w)

              results = []
              if not problems:
                  git("checkout", ref, "--", *files)
                  removed = mirror_dirs(tree, files)
                  results = apply_patches(problems, warnings)
                  validate(files, problems, warnings)

              if followed:
                  warnings.append("Additional scripts now sourced by upstream were synced automatically: " + ", ".join(followed))
              for w in watched_changed:
                  warnings.append(f"Upstream changed `{w}`. Review your own config.toml if a build starts failing.")

              blocked = bool(problems)
              if blocked:
                  sh("git", "reset", "--hard", "HEAD", check=False)

              lines = [f"## Sync with {UPSTREAM_REPO}@{branch}", "", f"Upstream commit: `{short(new_sha)}` (previous sync: `{short(old_sha)}`)", ""]
              lines.append("**Result: BLOCKED, nothing was pushed, the repository keeps its last working version.**" if blocked else "**Result: OK**")
              if problems:
                  lines += ["", "### Problems", *[f"- {p}" for p in problems]]
              if warnings:
                  lines += ["", "### Warnings", *[f"- {w}" for w in warnings]]
              if removed:
                  lines += ["", "### Removed (no longer in upstream)", *[f"- `{p}`" for p in removed]]
              if results:
                  lines += ["", "### Patches", "", "| Patch | File | Status | Detail |", "|---|---|---|---|"]
                  for label, path, status, detail, critical in results:
                      lines.append(f"| {label}{' (required)' if critical else ''} | `{path}` | {status} | {detail} |")
              if changes:
                  lines += ["", "### Upstream changes since last sync", "```", changes[:6000], "```"]
              if blocked:
                  if old_sha:
                      diff = git("diff", old_sha, new_sha, "--", *[f for f in files if f not in SYNC_DIRS], check=False)
                      if diff:
                          lines += ["", "### Upstream diff of the synced files", "```diff", diff[:25000], "```"]
                  lines += ["", "### How to fix", "Copy this whole summary into Claude and ask it to update the patch rules in `.github/workflows/sync.yml`."]
              summary = "\n".join(lines) + "\n"
              print(summary)
              if E("GITHUB_STEP_SUMMARY"):
                  with open(E("GITHUB_STEP_SUMMARY"), "a") as f:
                      f.write(summary)

              blob_ids = [sh("git", "rev-parse", "--verify", "-q", f"{ref}:{f}", check=False).stdout.strip() for f in files]
              block_key = hashlib.sha1(("\n".join(problems) + "".join(blob_ids)).encode()).hexdigest()[:8]
              if E("GITHUB_OUTPUT"):
                  with open(E("GITHUB_OUTPUT"), "a") as f:
                      f.write(f"blocked={'true' if blocked else 'false'}\nupstream_sha={new_sha}\nupstream_short={short(new_sha)}\nblock_key={block_key}\n")


          main()
          PY

      - name: Publish
        if: steps.sync.outputs.blocked != 'true'
        env:
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          UPSTREAM_SHORT: ${{ steps.sync.outputs.upstream_short }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          head_sha=$(git rev-parse HEAD)
          head_tree=$(git rev-parse 'HEAD^{tree}')
          new_tree=$(git write-tree)
          age_days=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))

          parents=(-p "$head_sha")
          record_upstream=false
          if [ "$TRACK_UPSTREAM" = "true" ] && ! git merge-base --is-ancestor "$UPSTREAM_SHA" "$head_sha"; then
            parents+=(-p "$UPSTREAM_SHA")
            record_upstream=true
          fi

          if [ "$new_tree" != "$head_tree" ]; then
            subject="chore: sync with upstream (${UPSTREAM_SHORT})"
          elif [ "$record_upstream" = "true" ]; then
            subject="chore: track upstream (${UPSTREAM_SHORT}), no file changes"
          elif [ "$age_days" -ge "$KEEPALIVE_DAYS" ]; then
            subject="chore: keepalive (GitHub pauses scheduled workflows after 60 days without activity)"
          else
            echo "Already up to date with upstream."
            exit 0
          fi

          new_commit=$(git commit-tree "$new_tree" "${parents[@]}" -m "$subject" -m "Upstream-Commit: ${UPSTREAM_SHA}")
          git reset -q --soft "$new_commit"

          if git push origin "HEAD:refs/heads/${TARGET_BRANCH}"; then
            echo "Pushed to ${TARGET_BRANCH}: ${subject}"
            exit 0
          fi
          remote_sha=$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)
          if [ "$remote_sha" != "$head_sha" ]; then
            echo "::warning::${TARGET_BRANCH} changed during this run. Nothing was overwritten, the next run will retry."
            exit 0
          fi
          echo "::error::Push to ${TARGET_BRANCH} failed."
          exit 1

      - name: Clear blocked markers
        if: steps.sync.outputs.blocked != 'true'
        run: |
          set -uo pipefail
          git ls-remote --tags origin 'refs/tags/sync-blocked-*' | awk '{print $2}' | while read -r ref; do
            git push origin --delete "$ref" || true
          done
          exit 0

      - name: Report blocked sync
        if: steps.sync.outputs.blocked == 'true'
        env:
          BLOCK_KEY: ${{ steps.sync.outputs.block_key }}
        run: |
          set -uo pipefail
          tag="sync-blocked-${BLOCK_KEY}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::warning::Sync is still blocked by the same upstream change (already reported). Nothing was pushed. Details are in the job summary."
            exit 0
          fi
          git tag "$tag" HEAD && git push origin "refs/tags/${tag}" || echo "::warning::Could not record the blocked state, you may be notified again on the next run."
          echo "::error::Sync blocked by an upstream change. Nothing was pushed, the repository keeps its last working version. Open the job summary for details."
          exit 1
