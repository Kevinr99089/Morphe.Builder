name: Sync Fork

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/j-hc/revanced-magisk-module.git

      - name: Fetch upstream branch
        run: |
          git fetch upstream refs/heads/main:refs/remotes/upstream/main

      - name: Merge upstream
        run: |
          git merge -X theirs upstream/main || true
          
      - name: Restore protected files
        run: |
          git checkout origin/main -- config.toml README.md || true

      - name: Remove unwanted files and folders
        run: |
          git rm -rf --ignore-unmatch module/ ksu_profile/ CONFIG.md build-termux.sh .github/ISSUE_TEMPLATE/ || true

      - name: Inject custom code in files
        run: |
          cat << 'EOF' > patch_files.py
          import os
          if os.path.exists("build.sh"):
              with open("build.sh", "r") as f:
                  content = f.read()
              
              content = content.replace('DEF_PATCHES_SRC="ReVanced/revanced-patches"', 'DEF_PATCHES_SRC="MorpheApp/morphe-patches"')
              content = content.replace('DEF_CLI_SRC="ReVanced/revanced-cli"', 'DEF_CLI_SRC="MorpheApp/morphe-cli"')
              content = content.replace('DEF_RV_BRAND="ReVanced"', 'DEF_RV_BRAND="Morphe"')

              old_block = r"""log "\nInstall [Microg](https://github.com/ReVanced/GmsCore/releases) for non-root YouTube and YT Music APKs"
          log "Use [zygisk-detach](https://github.com/j-hc/zygisk-detach) to detach YouTube and YT Music modules from Play Store"
          log "\n[revanced-magisk-module](https://github.com/j-hc/revanced-magisk-module)\n"
          log "$(cat "$TEMP_DIR"/*/changelog.md)"""

              new_block = r"""log "$(cat "$TEMP_DIR"/*/changelog.md)"

          # -- This part is generated by AI --
          AUTH_HEADER=(${GITHUB_TOKEN:+-H "Authorization: Bearer $GITHUB_TOKEN"})
          API_URL="https://api.github.com/repos/$DEF_PATCHES_SRC/releases/$([ "$DEF_PATCHES_VER" = "latest" ] && echo "latest" || echo "tags/$DEF_PATCHES_VER")"
          UPSTREAM_NOTES=$(curl -s "${AUTH_HEADER[@]}" "$API_URL" | jq -r '.body // "*No release notes found on the upstream repository.*"')
          # ----------------------------------"""

              content = content.replace(old_block, new_block)

              with open("build.sh", "w") as f:
                  f.write(content)

          build_yml_path = ".github/workflows/build.yml"
          if os.path.exists(build_yml_path):
              with open(build_yml_path, "r") as f:
                  content = f.read()
              
              content = content.replace('Build modules/APKs', 'Build modules/Morphe')
              content = content.replace('release_name: ReVanced', 'release_name: Morphe')
              
              with open(build_yml_path, "w") as f:
                  f.write(content)

          ci_yml_path = ".github/workflows/ci.yml"
          if os.path.exists(ci_yml_path):
              with open(ci_yml_path, "r") as f:
                  content = f.read()
                  
              content = content.replace('- cron: "0 16 * * *"', '- cron: "0 */1 * * *"')
              
              with open(ci_yml_path, "w") as f:
                  f.write(content)
          EOF
          
          python3 patch_files.py
          rm patch_files.py

      - name: Commit and push
        run: |
          if ! git diff-index --quiet HEAD --; then
            git add -A
            git commit -m "chore: sync with upstream j-hc/revanced-magisk-module"
            git push origin main
          fi
