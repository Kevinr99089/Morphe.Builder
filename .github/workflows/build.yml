name: Build Modules
on:
  workflow_call:
    inputs:
      from_ci:
        type: boolean
        required: false
        default: true

  workflow_dispatch:

jobs:
  run:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Check alternative repo env
        env:
          GH_TOKEN_ALT: ${{ secrets.GH_TOKEN_ALT }}
          REPO_ALT: ${{ vars.REPO_ALT }}
        run: |
          if [[ -n "$GH_TOKEN_ALT" && -n "$REPO_ALT" ]]; then
            echo "Release repository: $REPO_ALT"
          elif [[ -z "$GH_TOKEN_ALT" && -z "$REPO_ALT" ]]; then
            :
          else
            echo "::error::GH_TOKEN_ALT and REPO_ALT must either both be configured or both be absent."
            exit 1
          fi

      - name: Get next version code
        id: next_ver_code
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_ALT || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ vars.REPO_ALT || github.repository }}
        run: |
          TAG=$(gh release list -L 1 | awk -F '\t' '{print $3}')
          if [ -z "$TAG" ]; then TAG=0; fi
          echo "NEXT_VER_CODE=$((TAG + 1))" >> $GITHUB_OUTPUT

      - name: Build Morphe
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_ALT || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ vars.REPO_ALT || github.repository }}
          NEXT_VER_CODE: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
        run: |
          CFG=config.toml
          export GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          gh release view -R "$GITHUB_REPOSITORY" --json body -q .body >build.md 2>/dev/null || : >build.md
          if [ -s build.md ]; then
            echo "Updating config"
            UPDATE_CFG=$(./build.sh config.toml --config-update)
            if [ "$UPDATE_CFG" ]; then
              echo "'$UPDATE_CFG'"
              echo "$UPDATE_CFG" > config.json
              CFG=config.json
            fi
          fi
          ./build.sh "$CFG"

      - name: Get output
        id: get_output
        run: |
          DELIM="$(openssl rand -hex 8)"
          echo "BUILD_LOG<<${DELIM}" >> "$GITHUB_OUTPUT"
          cat build.md >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"
          cp -f build.md build.tmp

      - name: Upload release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_ALT || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ vars.REPO_ALT || github.repository }}
          TAG: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
          BODY: ${{ steps.get_output.outputs.BUILD_LOG }}
        run: |
          ls -lh ./build/*
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Morphe" --notes "$BODY"
            gh release upload "$TAG" ./build/* --clobber
          else
            gh release create "$TAG" ./build/* --title "Morphe" --notes "$BODY"
          fi
